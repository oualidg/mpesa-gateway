# ==============================================================================
# GitHub Actions — M-Pesa Gateway CI/CD Pipeline
#
# Trigger: push to main branch
#
# Steps:
#   1. Checkout source code
#   2. Set up Java 21
#   3. Cache Maven dependencies
#   4. Run full test suite
#   5. Build production JAR
#   6. Log in to GitHub Container Registry (GHCR)
#   7. Build Docker image
#   8. Push Docker image to GHCR
#   9. Pull new image and restart container via docker compose
#
# Runner: self-hosted (runs on the Ubuntu server at /opt/payments/)
# Registry: ghcr.io (GitHub Container Registry, free private images)
#
# Graceful shutdown: docker-compose.yml sets stop_grace_period=35s for
# mpesa-gateway to allow in-flight processing to complete before the
# container is forcibly stopped.
# ==============================================================================

name: M-Pesa Gateway CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Test, Dockerize, Deploy
    runs-on: self-hosted

    steps:

      # ------------------------------------------------------------------------
      # Step 1: Checkout
      # ------------------------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Step 2: Set up Java 21
      # ------------------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ------------------------------------------------------------------------
      # Step 3: Cache Maven dependencies
      # Cache key includes pom.xml hash — invalidated when dependencies change.
      # ------------------------------------------------------------------------
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ------------------------------------------------------------------------
      # Step 4 & 5: Run tests and build JAR
      # ------------------------------------------------------------------------
      - name: Run tests and build JAR
        run: mvn clean package

      # ------------------------------------------------------------------------
      # Step 6: Log in to GitHub Container Registry
      # ------------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Step 7 & 8: Build and push Docker image
      # Tags the image as both :latest and :<git-sha> for rollback traceability.
      # ------------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/oualidg/mpesa-gateway:latest
            ghcr.io/oualidg/mpesa-gateway:${{ github.sha }}

      # ------------------------------------------------------------------------
      # Step 9: Deploy to server
      # Pulls the new image and restarts only the mpesa-gateway container.
      # Graceful shutdown (35s) allows the outbox processor and any in-flight
      # RabbitMQ message handling to complete before the container stops.
      # ------------------------------------------------------------------------
      - name: Deploy
        run: |
          cd /opt/payments
          docker compose pull mpesa-gateway
          docker compose up -d --no-deps mpesa-gateway
          docker image prune -f