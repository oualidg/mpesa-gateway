spring.main.banner-mode=off

# ==============================
# MongoDB (Testcontainers ? URI overridden programmatically)
# ==============================
spring.data.mongodb.auto-index-creation=false

# ==============================
# RabbitMQ (disabled for integration tests)
# ==============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==============================
# UA Service
# ==============================
app.ua-service.base-url=http://localhost:8080
app.ua-service.api-key=test-api-key
app.ua-service.connect-timeout=200ms
app.ua-service.read-timeout=3000ms
app.ua-service.connection-request-timeout=500ms
app.ua-service.pool-size=5
app.ua-service.max-connections-per-route=5
app.ua-service.idle-connection-evict-duration=30s

# ==============================
# Outbox
# ==============================
app.outbox.poll-interval=5s
app.outbox.batch-size=100
app.outbox.alert-threshold=5m

# ==============================
# Callback Security
# ==============================
app.callback.token=test-callback-token

# ==============================
# Validation Fallback
# ==============================
app.validation.fallback.enabled=true
app.validation.fallback.window=90d

# ==============================
# Gateway
# ==============================
app.gateway.short-code=600123

# ==============================
# RabbitMQ Topology
# ==============================
app.messaging.exchange=payments.exchange
app.messaging.provisioning-routing-key=provisioning.request
app.messaging.results-queue=mpesa.results.queue
app.messaging.mpesa-result-routing-key=mpesa.result

