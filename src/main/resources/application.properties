spring.application.name=mpesa-gateway
server.port=8081
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==============================
# MongoDB
# ==============================
spring.data.mongodb.uri=mongodb://${MONGO_USER}:${MONGO_PASS}@localhost:27017/mpesa?replicaSet=rs0&authSource=mpesa&maxPoolSize=20
spring.data.mongodb.auto-index-creation=false

# ==============================
# RabbitMQ
# ==============================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.virtual-host=/payments
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# ==============================
# Actuator
# ==============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# ==============================
# Validation Circuit Breaker (Gateway ? UA)
# ==============================
resilience4j.circuitbreaker.instances.ua-validation.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ua-validation.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.ua-validation.slow-call-duration-threshold=2500ms
resilience4j.circuitbreaker.instances.ua-validation.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.ua-validation.sliding-window-size=20
resilience4j.circuitbreaker.instances.ua-validation.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.ua-validation.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ua-validation.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.ua-validation.automatic-transition-from-open-to-half-open-enabled=true

# ==============================
# UA Service HTTP Client
# ==============================
app.ua-service.base-url=${UA_SERVICE_BASE_URL}
app.ua-service.api-key=${UA_SERVICE_API_KEY}
app.ua-service.connect-timeout=200ms
app.ua-service.read-timeout=3000ms
app.ua-service.connection-request-timeout=500ms
app.ua-service.pool-size=20
app.ua-service.max-connections-per-route=20
app.ua-service.idle-connection-evict-duration=30s

# ==============================
# Outbox Processor
# ==============================
app.outbox.poll-interval=5s
app.outbox.batch-size=100
app.outbox.alert-threshold=5m
app.outbox.lease-timeout=30s

# ==============================
# Callback Security
# ==============================
app.callback.token=${CALLBACK_TOKEN}

# ==============================
# Validation Fallback (ADR-006)
# ==============================
app.validation.fallback.enabled=true
app.validation.fallback.window=90d

# ==============================
# RabbitMQ Topology
# ==============================
app.messaging.exchange=payments.exchange
app.messaging.provisioning-routing-key=provisioning.request
app.messaging.results-queue=mpesa.results.queue
app.messaging.mpesa-result-routing-key=mpesa.result

# ==============================
# Gateway
# ==============================
app.gateway.short-code=${MPESA_SHORT_CODE}

# ==============================
# Application Metadata (Exposed via /info)
# ==============================
info.app.name=M-Pesa Gateway
info.app.description=Safaricom C2B Paybill integration gateway for the Payments Platform
info.app.version=0.0.1-SNAPSHOT
info.app.author=Oualid Gharach
info.app.contact.email=oualid.gharach@gmail.com
info.app.contact.github=https://github.com/oualidg/mpesa-gateway